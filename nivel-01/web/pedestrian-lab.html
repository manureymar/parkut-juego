<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Revisión de animaciones de peatones</title><script type="importmap">{"imports":{"three":"./vendor/build/three.module.js"}}</script><style>body{margin:0;background:#a5b7c5;font:13px Arial}#caption{position:absolute;top:10px;left:12px;color:#162a35;max-width:370px}canvas{display:block}</style></head><body><div id="caption"></div><script type="module">
import * as T from 'three';import {GLTFLoader} from './vendor/examples/jsm/loaders/GLTFLoader.js';import {PedestrianAnimation} from './pedestrian-animation.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(400,480);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#a5b7c5');scene.add(new T.HemisphereLight(0xc8dfff,0x7b5f40,1.6));const light=new T.DirectionalLight(0xffe1b2,3);light.position.set(-3,5,3);scene.add(light);const camera=new T.PerspectiveCamera(35,400/480,.01,100);camera.position.set(2,1.35,3.4);camera.lookAt(0,.92,0);scene.add(new T.GridHelper(6,24,0x435c66,0x83969c));const loader=new GLTFLoader(),profiles=await(await fetch('./assets/pedestrians/manifest.json')).json();let pivot,model,anim,profile;
window.review={profiles,load:async index=>{if(pivot)scene.remove(pivot);profile=profiles[index];const g=await loader.loadAsync('./assets/pedestrians/'+profile.id+'.glb');model=g.scene;pivot=new T.Group();scene.add(pivot);pivot.add(model);const box=new T.Box3().setFromObject(model,true);model.scale.setScalar(profile.height/(box.max.y-box.min.y));anim=new PedestrianAnimation(model,g.animations,profile);return profile.clips.map(({motion,...clip})=>clip);},pose:(name,time)=>{anim.mixer.stopAllAction();anim.current=null;anim.previous=null;anim.pose(name,time,0,true);let min=Infinity,max=-Infinity;const v=new T.Vector3(),hands=[];model.traverse(n=>{if(n.isSkinnedMesh){n.skeleton.update();for(let i=0;i<n.geometry.attributes.position.count;i++){n.getVertexPosition(i,v).applyMatrix4(n.matrixWorld);min=Math.min(min,v.y);max=Math.max(max,v.y);}}if(n.isBone&&/Hand$|Head$/.test(n.name))hands.push({bone:n.name,position:n.getWorldPosition(v).toArray()});});document.getElementById('caption').textContent=profile.id+' · '+name+' · '+time.toFixed(2)+'s';renderer.render(scene,camera);return {min,max,offset:model.position.y,hands};}};window.ready=true;
</script></body></html>

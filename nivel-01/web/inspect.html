<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#748ca1}canvas{display:block}#label{position:absolute;top:15px;left:20px;color:white;font:20px sans-serif}</style><div id="label"></div><script type="importmap">{"imports":{"three":"./vendor/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from './vendor/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a2b4c2');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(900,900);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xc8dfff,0x7b5f40,2));const sun=new THREE.DirectionalLight(0xffe1b2,3);sun.position.set(-3,5,3);scene.add(sun);const camera=new THREE.PerspectiveCamera(40,1,.001,100);let object,mixer,animations;
window.loadModel=async function(id,view='front'){if(object)scene.remove(object);const g=await new GLTFLoader().loadAsync('./assets/'+id+'.glb');object=g.scene;animations=g.animations;scene.add(object);object.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(object);const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const d=Math.max(size.x,size.y,size.z);camera.position.copy(center).add(new THREE.Vector3(view==='front'?.85:0,view==='top'?1.65:.95,view==='top'?.005:1.5).multiplyScalar(d));camera.lookAt(center);document.querySelector('#label').textContent=id+' / '+view;mixer=new THREE.AnimationMixer(object);renderer.render(scene,camera);return {min:box.min,max:box.max,animations:g.animations.map(a=>({name:a.name,duration:a.duration,tracks:a.tracks.slice(0,4).map(t=>({name:t.name,start:Array.from(t.values.slice(0,6)),end:Array.from(t.values.slice(-6))}))}))};};
window.showClip=(name,time=0)=>{mixer.stopAllAction();const a=mixer.clipAction(animations.find(a=>a.name===name));a.play();mixer.setTime(time);renderer.render(scene,camera);};
window.groundGrid=()=>{const ray=new THREE.Raycaster(),a=[];for(let z=.4;z>=-.4;z-=.05){let row=[];for(let x=-.3;x<=.3;x+=.05){ray.set(new THREE.Vector3(x,2,z),new THREE.Vector3(0,-1,0));let h=ray.intersectObject(object,true)[0];row.push(h?+h.point.y.toFixed(3):null);}a.push(row);}return a;};

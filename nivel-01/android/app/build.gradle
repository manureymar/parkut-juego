plugins { id 'com.android.application' }
android {
    namespace 'com.parkut.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.parkut.game'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    if (project.hasProperty('parkutSigningStore')) {
        signingConfigs.debug.storeFile = file(project.property('parkutSigningStore'))
    }
    buildFeatures { buildConfig true }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ['webp'] }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }

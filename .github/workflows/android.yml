name: Compilar APK de Parkut
on:
  push:
    branches: [main]
    paths: ['nivel-01/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Conservar firma de pruebas entre compilaciones
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: parkut-android-debug-signing-v1
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar aplicación de prueba
        working-directory: nivel-01/android
        run: gradle --no-daemon assembleDebug
      - name: Preparar APK y checksum
        run: |
          mkdir -p distribucion
          cp nivel-01/android/app/build/outputs/apk/debug/app-debug.apk distribucion/Parkut-Nivel01.apk
          cd distribucion
          sha256sum Parkut-Nivel01.apk > Parkut-Nivel01.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Parkut-Nivel01-APK
          path: distribucion/*
          retention-days: 90
      - name: Publicar descarga de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nivel-01-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" distribucion/* --title "Parkut · Nivel 01 · prueba ${GITHUB_RUN_NUMBER}" --notes "Parkut 0.2.0: apoyo estable, maniobras automáticas, escalera del tanque, rodada y nueva iluminación. Android 8.0 o superior. Código y recursos incluidos en el repositorio. Compilación $GITHUB_SHA." --prerelease --target "$GITHUB_SHA"

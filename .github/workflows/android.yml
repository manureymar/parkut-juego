name: Compilar Jumping in the City
on:
  push:
    branches: [main]
    paths: ['nivel-01/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar rutas y actividades de peatones
        run: |
          node nivel-01/scripts/test-pedestrians.mjs
          node nivel-01/scripts/test-dynamic-v051.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Conservar firma de pruebas entre compilaciones
        uses: actions/cache@v4
        with:
          path: ~/.android/parkut-debug.keystore
          key: parkut-android-debug-signing-v2
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar firma de pruebas
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/parkut-debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/parkut-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Parkut Debug,O=Parkut,C=US' -noprompt
          fi
      - name: Compilar aplicación de prueba
        working-directory: nivel-01/android
        run: gradle --no-daemon assembleDebug -PparkutSigningStore="$HOME/.android/parkut-debug.keystore"
      - name: Preparar APK y checksum
        run: |
          mkdir -p distribucion
          cp nivel-01/android/app/build/outputs/apk/debug/app-debug.apk distribucion/Jumping-in-the-City-v0.5.1.apk
          cd distribucion
          sha256sum Jumping-in-the-City-v0.5.1.apk > Jumping-in-the-City-v0.5.1.apk.sha256
      - name: Verificar firma y recursos del APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs distribucion/Jumping-in-the-City-v0.5.1.apk > distribucion/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging distribucion/Jumping-in-the-City-v0.5.1.apk > distribucion/package-info.txt
          python3 nivel-01/scripts/verify-apk.py distribucion/Jumping-in-the-City-v0.5.1.apk --signature distribucion/signature.txt --badging distribucion/package-info.txt --out distribucion/apk-0.5.1-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: Jumping-in-the-City-v0.5.1-APK
          path: distribucion/*
          retention-days: 90
      - name: Publicar descarga de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nivel-01-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" distribucion/* --title "Jumping in the City · Nivel 01 · prueba ${GITHUB_RUN_NUMBER}" --notes "Jumping in the City 0.5.1: correcciones de colisiones y altura de calles, tráfico y peatones que ceden el paso, salto con apoyo, tubos bidireccionales, ventanas escalables, agarres estables, red continua y cámara protegida. Android 8.0 o superior. Código y recursos incluidos en el repositorio. Compilación $GITHUB_SHA." --prerelease --target "$GITHUB_SHA"
